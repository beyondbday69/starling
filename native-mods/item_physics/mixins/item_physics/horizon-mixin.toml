[mod]
id = "item_physics"
version = "0.1.0"
priority = 100

# The commit it was tested on. It uses only the native hook points (hooks 1 in
# compatibility.json) and one hookable game method; the launcher builds it on
# any Horizon that has them.
[compatibility]
horizon_revision = "ed7a3853b54808e5e71340eb0ed78d3742721637"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "item_physics"
source = "runtime.rs"

# The dropped items: taken over when the mod is on, vanilla otherwise.
[[injection]]
id = "dropped"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::item_draw::Game<'_>::dropped_item_geometry"
helper = "dropped.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
