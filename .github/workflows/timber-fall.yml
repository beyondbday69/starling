name: timber-fall
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-mods/timber_fall/**'
      - '.github/workflows/timber-fall.yml'

permissions:
  contents: read

concurrency:
  group: timber-fall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: timber-fall
          workspaces: native-mods/timber_fall

      - name: Formatting
        run: cargo +stable fmt --manifest-path native-mods/timber_fall/Cargo.toml --check

      - name: Clippy (pure Rust)
        run: cargo +stable clippy --manifest-path native-mods/timber_fall/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests (pure Rust)
        run: cargo +stable test --manifest-path native-mods/timber_fall/Cargo.toml

      - name: Type-check Horizon SDK adapter
        run: cargo +stable check --manifest-path native-mods/timber_fall/Cargo.toml --features horizon-sdk
