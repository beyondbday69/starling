# Reimagined UltraFast v1.5 - Snapdragon 60 FPS Edition (Complementary Underwater Alignment)
oldLighting=false
shadowTerrain=true
shadowEntities=true
# Phone: skip your own shadow and chest/bed/sign shadows (fewer draw calls in the shadow pass)
shadowPlayer=false
shadowBlockEntities=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
separateAo=false

# Water ripple normal map (from Complementary Reimagined, rg = normal, a = height). Used in the composite pass.
texture.composite.gaux4=lib/textures/cloud-water.png

# Mystique draws its own box clouds, so vanilla clouds are switched off while they're on
#ifdef BLOCKY_CLOUDS
clouds=off
#endif

screen=<profile> <empty> [QUICK_SCREEN] <empty> [SHADOWS_SCREEN] [LIGHT_SCREEN] [COLORS_SCREEN] [COLOR_GRADING_SCREEN] [WATER_SCREEN] [CLOUDS_SCREEN] [FOLIAGE_SCREEN] [CAMERA_SCREEN] [TOON_SCREEN] [ATMOS_SCREEN]
screen.QUICK_SCREEN=SHADOWS shadowDistance shadowMapResolution SHADOW_SMOOTH <empty> <empty> REFLECTIONS REFLECTION_STRENGTH TOON_MODE MOTION_BLUR EYE_ADAPTATION BLOOM WAVING_FOLIAGE CLOUD_STEPS CLOUD_RENDER
